name: release

# Push, not tag. `pnpm -r publish` only publishes versions that are not already on the
# registry, so re-running this workflow can never double-publish — which makes the registry
# itself the source of truth for "released", and a tag gate redundant.
on:
  push:
    branches: [main]

permissions:
  contents: read
  # npm provenance signs with a short-lived OIDC token from the runner.
  id-token: write

# Two pushes in quick succession would otherwise race two publishes.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Provenance requires a cloud-hosted runner on a supported provider.
    runs-on: ubuntu-latest
    # A gate on a HUMAN, not on branch hygiene. This repo is public and a merged pull request
    # is a push to main, so without this a merge is enough to reach NODE_AUTH_TOKEN — either
    # through a package lifecycle script that `pnpm -r publish` runs, or by having `pnpm test`
    # create a fourth package for `-r` to enumerate. Configure `npm-publish` in the repo's
    # Settings → Environments with a required reviewer. Branch protection is NOT the control
    # here: requiring pull requests on main would reject the release script's direct push.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job pushes; don't leave a usable credential in the checkout.
          persist-credentials: false

      # No `version:` input on purpose. The action reads packageManager from package.json,
      # and specifying both is a hard error ("Multiple versions of pnpm specified") the
      # moment the two disagree — a failure that would land only AFTER the release commit is
      # public, which is exactly what the drift guard exists to prevent. One source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Before typecheck: @dropinnodex/server and @dropinnodex/react resolve @dropinnodex/client's types
      # through its built dist/index.d.ts, which does not exist in a fresh clone. The build
      # is topological, so client goes first on its own.
      - run: pnpm -r build

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # --no-git-checks: the build above wrote dist/, so the tree is dirty and pnpm would
      # otherwise refuse. Nothing here is published that the gates above did not pass.
      - run: pnpm -r publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
